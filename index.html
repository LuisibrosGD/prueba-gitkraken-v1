<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto de Prueba - GitKraken</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌿 Proyecto de Prueba con Ramas</h1>
            <p>Practicando Git con GitKraken</p>
        </header>

        <main>
            <section class="feature main-feature">
                <h2>✨ Característica Principal</h2>
                <button id="mainButton" class="btn-primary">Haz clic aquí</button>
                <div id="mainMessage" class="message"></div>
            </section>

            <section class="feature secondary-feature">
                <h2>🎯 Característica Secundaria</h2>
                <button id="secondaryButton" class="btn-secondary">Click me</button>
                <div id="secondaryMessage" class="message"></div>
            </section>

            <section class="info">
                <h3>📊 Información de la Rama Actual</h3>
                <div id="branchInfo" class="branch-info">
                    <p>Cargando información...</p>
                </div>
            </section>
        </main>

        <footer>
            <p>Proyecto para pruebas de branching con GitKraken</p>
        </footer>
    </div>

    <!-- Botón de modo oscuro/claro -->
    <button id="themeToggle" class="theme-toggle">🌙 Modo Oscuro</button>

    <script src="js/main.js"></script>
</body>
</html>
